name: Build standalone Intel DMG (experimental)

on:
  workflow_dispatch:
  push:
    branches:
      - dev/monterey-intel
    paths:
      - app/MacLauncher.swift
      - app/launch-standalone.sh
      - app/Info.plist
      - scripts/build-standalone.sh
      - scripts/build-aimp-icon.sh
      - app/find-official-aimp.sh
      - tests/test-monterey-launcher.sh
      - .github/workflows/standalone-dmg.yml

permissions:
  contents: read

jobs:
  package-intel:
    runs-on: macos-15-intel
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Check source
        run: |
          bash -n app/launch-standalone.sh
          bash -n app/find-official-aimp.sh
          bash -n scripts/build-standalone.sh
          bash -n scripts/build-aimp-icon.sh
          plutil -lint app/Info.plist
          /bin/bash -n tests/test-monterey-launcher.sh
      - name: Regression — launch with zero args under macOS system Bash
        run: /bin/bash tests/test-monterey-launcher.sh
      - name: Verify official AIMP download bootstrap without publishing AIMP
        run: |
          bash app/find-official-aimp.sh "$RUNNER_TEMP/aimp-original.zip"
          unzip -tqq "$RUNNER_TEMP/aimp-original.zip"
      - name: Install icon extractor on build machine only
        run: brew install icoutils
      - name: Build macOS Intel app + DMG with Wine and GStreamer embedded
        env:
          AIMP_ICON_ZIP: ${{ runner.temp }}/aimp-original.zip
        run: |
          bash scripts/build-standalone.sh
      - name: Self-test early native diagnostic log and app icon
        run: |
          set -euo pipefail
          "dist/AIMP Monterey.app/Contents/MacOS/AIMP" --self-test
          test -s "$HOME/Library/Logs/AIMP Monterey/launcher.log"
          test -s "dist/AIMP Monterey.app/Contents/Resources/AIMP.icns"
          plutil -extract CFBundleIconFile raw -o - "dist/AIMP Monterey.app/Contents/Info.plist" | grep -Fx "AIMP.icns"
      - name: Upload experimental DMG
        uses: actions/upload-artifact@v4
        with:
          name: AIMP-Monterey-Intel-Standalone-UNTESTED
          path: |
            dist/AIMP-Monterey-Intel-Standalone.dmg
            dist/AIMP-Monterey-Intel-Standalone.dmg.sha256
          if-no-files-found: error
          retention-days: 14
